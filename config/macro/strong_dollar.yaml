references:
  - https://fred.stlouisfed.org/series/DTWEXBGS
narrative:
  extra: "Foreign pretax income is proxied by each company's 10-K domestic/foreign split, so profit earned abroad in dollars (oil, some commodities) is treated as if it were in local currency. Lost export competitiveness is not modelled, and the effect is counted for one year."
