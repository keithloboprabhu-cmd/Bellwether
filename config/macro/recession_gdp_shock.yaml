references:
  - https://fred.stlouisfed.org/series/GDPC1
  - https://fred.stlouisfed.org/series/CORALACBN
narrative:
  extra: "Betas are historical averages with wide ranges (low R²), so treat industry differences as indicative. Credit losses are added only for downturns, and only for banks; the shock is counted for one year."
