id: recession_gdp_shock
scope: full_market
name: Recession (GDP shock)
description: Real GDP growth falls short of the baseline for a year. Each industry's revenue moves by its historical sensitivity to GDP (estimated from its companies' filings since 2009) and falls to profit through operating leverage. Banks also set aside more for loan losses.
persistence: one_time
user_inputs:
  - key: d_gdp_pts
    label: Change in real GDP growth
    unit: percentage points
    min: -6
    max: 3
    step: 0.5
    default: -2
    help: Negative is a slowdown. Real GDP fell about 2.5% in 2009 against roughly 2% trend growth, a gap of about 4.5 points; a mild recession is 1–2 points.
assumptions:
  - key: loan_share_of_assets
    label: Loans as a share of bank assets
    unit: fraction
    low: 0.35
    base: 0.45
    high: 0.6
    source: estimate
    rationale: Large US banks hold roughly 35–60% of assets in loans; the rest is securities, cash and trading assets.
  - key: loss_rate_per_gdp_pt
    label: Rise in bank credit losses per 1-point GDP shortfall
    unit: percent of loans
    low: 0.15
    base: 0.3
    high: 0.5
    source: estimate
    rationale: Net charge-off rates rose about 2 points of loans in 2008–10 against a ~4.5-point growth shortfall (≈0.45 per point); milder recessions show less.
industry_effects:
  consumer_retail:
    reason: Revenue moves with GDP (β = 1.27).
    assumptions:
      - key: gdp_beta_consumer_retail
        label: Consumer & Retail revenue growth per 1 point of GDP growth
        unit: number
        low: 0.91
        base: 1.27
        high: 1.81
        source: "Pooled OLS of Consumer & Retail companies' annual revenue growth on real GDP growth (FRED GDPC1), FY2009–latest, 345 company-years, R² 0.04 (data/snapshots/gdp_betas.json, Methodology page). Range: ±1 s.e. across the full and ex-2020–21 fits."
    channels:
      - type: demand_volume
        label: Revenue moves with the economy
        params:
          d_volume: assumption.gdp_beta_consumer_retail * input.d_gdp_pts / 100
          exposed_revenue_share: 1
  education:
    reason: Revenue moves with GDP (β = 0.70).
    assumptions:
      - key: gdp_beta_education
        label: Education revenue growth per 1 point of GDP growth
        unit: number
        low: -2.62
        base: 0.7
        high: 1.47
        source: "Pooled OLS of Education companies' annual revenue growth on real GDP growth (FRED GDPC1), FY2009–latest, 258 company-years, R² 0.00 (data/snapshots/gdp_betas.json, Methodology page). Range: ±1 s.e. across the full and ex-2020–21 fits."
    channels:
      - type: demand_volume
        label: Revenue moves with the economy
        params:
          d_volume: assumption.gdp_beta_education * input.d_gdp_pts / 100
          exposed_revenue_share: 1
  energy_resources:
    reason: Revenue moves with GDP (β = 6.19).
    assumptions:
      - key: gdp_beta_energy_resources
        label: Energy revenue growth per 1 point of GDP growth
        unit: number
        low: 2.23
        base: 6.19
        high: 6.89
        source: "Pooled OLS of Energy companies' annual revenue growth on real GDP growth (FRED GDPC1), FY2009–latest, 313 company-years, R² 0.20 (data/snapshots/gdp_betas.json, Methodology page). Range: ±1 s.e. across the full and ex-2020–21 fits."
    channels:
      - type: demand_volume
        label: Revenue moves with the economy
        params:
          d_volume: assumption.gdp_beta_energy_resources * input.d_gdp_pts / 100
          exposed_revenue_share: 1
  financial_services:
    reason: Revenue moves with GDP (β = 0.12).
    assumptions:
      - key: gdp_beta_financial_services
        label: Financial Services revenue growth per 1 point of GDP growth
        unit: number
        low: -2.43
        base: 0.12
        high: 0.58
        source: "Pooled OLS of Financial Services companies' annual revenue growth on real GDP growth (FRED GDPC1), FY2009–latest, 358 company-years, R² 0.00 (data/snapshots/gdp_betas.json, Methodology page). Range: ±1 s.e. across the full and ex-2020–21 fits."
    channels:
      - type: demand_volume
        label: Revenue moves with the economy
        params:
          d_volume: assumption.gdp_beta_financial_services * input.d_gdp_pts / 100
          exposed_revenue_share: 1
      - type: cost
        label: Higher loan-loss provisions
        company_kinds: [bank]
        params:
          exposed_cost_share: 0
          shock_pct: 0
          dcost_musd: -baseline.total_assets * assumption.loan_share_of_assets * assumption.loss_rate_per_gdp_pt / 100 * min(0, input.d_gdp_pts)
  healthcare:
    reason: Revenue moves with GDP (β = 0.51).
    assumptions:
      - key: gdp_beta_healthcare
