    pell_revenue_share:
      value: 0
      source: estimate
      rationale: Its degrees are mostly master's programs and it is not itself a Title IV institution.
    earnings_test_at_risk_revenue_share:
      value: 0.005
      low: 0
      high: 0.01
      source: estimate
      rationale: Only partner-university degree programs fall under the test; computer science, data science and business master's degrees generally clear the bachelor's-earnings benchmark.
    ninety_ten_hi_ratio:
      value: 0
      source: estimate
      rationale: Not a proprietary Title IV institution.
    ninety_ten_hi_revenue_share:
      value: 0
      source: estimate
      rationale: Not a proprietary Title IV institution.
    ninety_ten_lo_ratio:
      value: 0
      source: estimate
      rationale: Not a proprietary Title IV institution.
    ninety_ten_lo_revenue_share:
      value: 0
      source: estimate
      rationale: Not a proprietary Title IV institution.
    esa_capture_share:
      value: 0
      source: estimate
      rationale: Adult-learner platform; K-12 ESA dollars rarely reach it.
    online_revenue_share:
      value: 1
      low: 0.98
      high: 1
      source: estimate
      rationale: An online learning platform; all courses, certificates and degrees are delivered online.
    us_consumer_revenue_share:
      value: 0.34
      low: 0.25
      high: 0.45
      source: "Coursera 2025 10-K: United States revenue $384.7M of $757.5M (51%); Consumer segment $502.2M of $757.5M (66%)"
      source_url: https://www.sec.gov/Archives/edgar/data/1651562/000165156226000015/cour-20251231.htm
      rationale: The US consumer split is not disclosed; assumes the US share of Consumer revenue matches the company-wide US share (51% × 66% ≈ 34%).
