      value: 0.01
      low: 0
      high: 0.02
      source: estimate
      rationale: "Coursera 2025 10-K: offers 50+ online degrees with university partners; some US master's students borrow federal loans at the partner university, and Coursera's revenue share of those degrees falls if enrolment does. Degrees are a small part of the $502.2M Consumer segment."
