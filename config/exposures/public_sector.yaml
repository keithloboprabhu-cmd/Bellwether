# Public Sector (government contractor) company exposures. Fractions of total revenue.
# Cited figures come from each company's latest 10-K (the same filing as the baseline in data/snapshots/baselines.json).
# Fiscal years differ: BAH FY ends Mar-2026, LDOS Jan-2-2026, SAIC Jan-30-2026, CACI Jun-2026, PSN and GD Dec-2025.
industry: public_sector
companies:
  BAH:
