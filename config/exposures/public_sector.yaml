      source_url: https://www.sec.gov/Archives/edgar/data/1443646/000162828026037521/bah-20260331.htm
    govcon_services_share:
      value: 0.98
      low: 0.95
      high: 0.98
      source: "Booz Allen FY2026 10-K: substantially all revenue is from services under U.S. government contracts; ~98% from the U.S. government"
      source_url: https://www.sec.gov/Archives/edgar/data/1443646/000162828026037521/bah-20260331.htm
    govcon_advisory_share:
      value: 0.30
      low: 0.20
      high: 0.45
      source: estimate
      rationale: "Booz Allen's management-consulting heritage makes it the most exposed name; its 10-K shows Civil & Commercial revenue fell from $4,170M to $3,248M (−22%) in FY2026 amid efficiency reviews and contract cancellations. Advisory work is a large part of civil plus some defense staff-support work."
    govcon_fed_it_share:
      value: 0.45
      low: 0.35
      high: 0.60
      source: estimate
      rationale: Booz Allen calls itself the government's largest AI provider and lists digital modernization, cloud, data and cyber as core lines; no revenue split by offering is disclosed.
