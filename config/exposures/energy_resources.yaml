      value: 0.2017
      low: 0.1729
      high: 0.2306
      source: "XOM 2025 10-K: for 2026, a $1/bbl change in Brent ≈ $700M annual after-tax Upstream earnings (excl. derivatives)"
      source_url: https://www.sec.gov/Archives/edgar/data/34088/000003408826000045/xom-20251231.htm
