      source_url: https://corporate.exxonmobil.com/news/reporting-and-publications/sustainability-report/performance-data-table
      rationale: XOM reports 0.16 Mt CH4 operated methane in 2024 (global); ~60% assumed US, where its unconventional (XTO/Permian) gas systems are.
