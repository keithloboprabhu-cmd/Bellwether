      source_url: https://www.sec.gov/Archives/edgar/data/34088/000003408826000045/xom-20251231.htm
      rationale: Range ±$100M; XOM's 3Q25 investor sensitivity page showed $650M on 2025 volumes.
    us_scope1_co2e_mt:
      value: 46
      low: 35
      high: 60
      source: estimate
      source_url: https://corporate.exxonmobil.com/news/reporting-and-publications/sustainability-report/performance-data-table
      rationale: XOM performance data table reports 92 Mt CO2e operated Scope 1 for 2024 (global); ~half assumed US (four large Gulf Coast/Midwest refining-chemical complexes plus Permian). No US split is published.
