      value: 0.025
      low: 0.015
      high: 0.04
      source: estimate
      source_url: https://www.eia.gov/todayinenergy/detail.php?id=65804
      rationale: US upstream (1,522 kb/d liquids + gas per 2025 10-K) is ~10% of revenue; ~25% of it assumed federal (New Mexico Delaware Basin federal acreage; Midland/Pioneer is mostly private Texas land). EIA - federal onshore 1.7 + offshore 1.8 of 13.2 mb/d US crude in 2024 (~27%).
