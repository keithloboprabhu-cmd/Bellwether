# Energy & Resources company exposures. Fractions are of total revenue / cost of revenue (FY2025 baselines).
# Brent reference for oil_price_sensitivity: $69.06/bbl, 2025 average (XOM 2025 10-K realizations table).
industry: energy_resources
companies:
