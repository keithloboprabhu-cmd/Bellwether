      value: 0.5
      low: 0.25
      high: 0.75
      source: estimate
      rationale: A US-wide carbon price hits all domestic refiners, so part of the refining-emissions cost reaches fuel prices; upstream crude is priced globally and absorbs most of its share.
    us_methane_kt_ch4:
      value: 96
      low: 60
      high: 130
