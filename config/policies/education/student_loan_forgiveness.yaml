id: student_loan_forgiveness
industry: education
name: Student loan forgiveness
description: Cancelling federal student debt frees up borrowers' monthly payments, a small boost to household spending that reaches these companies only through their tiny share of all US consumer spending. Exposure in this universe is very small; the effect on future enrollment and borrowing behaviour is not modelled.
persistence: "years: 10"
user_inputs:
  - key: forgiven_bn
    label: Federal student debt forgiven
    unit: USD billions
    min: 0
    max: 500
    step: 10
    default: 50
    help: Total principal cancelled. The default is a targeted program (e.g. faster Public Service Loan Forgiveness or income-driven-repayment discharges), not broad cancellation.
assumptions:
  - key: payment_rate
    label: Annual payments freed per dollar forgiven
    unit: fraction
    low: 0.04
    base: 0.07
    high: 0.11
    source: estimate
    rationale: A 10-year standard repayment plan costs ~11% of the balance a year; borrowers on income-driven plans pay much less, so the average freed payment is lower.
  - key: mpc
    label: Share of freed payments spent
    unit: fraction
    low: 0.4
    base: 0.6
    high: 0.8
    source: estimate
    rationale: Freed payments arrive as steady monthly cash flow to younger, often liquidity-constrained households, who spend most of it; some goes to paying down other debt.
channels:
  - type: demand_transfer
    label: Borrowers spend freed loan payments
    params:
      total_transfer_musd: input.forgiven_bn * 1000 * assumption.payment_rate
      mpc: assumption.mpc
      capture_share: baseline.revenue * exposure.us_consumer_revenue_share / macro.pce_musd
exposure_keys: [us_consumer_revenue_share]
default_role: neutral
references:
  - https://www.nber.org/papers/w31291
narrative:
  extra: "Each company's share of all US consumer spending is a few thousandths of a percent, so even large forgiveness programs barely move EPS."
