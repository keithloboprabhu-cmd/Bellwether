id: ninety_ten_rule_change
industry: education
name: Tighter 90/10 rule (e.g. 85/15)
description: Lowers the cap on the share of a for-profit college's cash revenue that may come from federal education aid (90% today). An institution above the new cap must either raise non-federal revenue or shed federally funded students. Strayer University (89.64% federal in FY2024) is the most exposed, then Covista's medical schools (86%); Stride, Duolingo and Coursera own no proprietary Title IV school.
persistence: permanent
user_inputs:
  - key: cap_pct
    label: New maximum federal share of revenue
    unit: percent
    min: 75
    max: 90
    step: 1
    default: 85
    help: 90 is current law (since 2023 counting all federal education aid, including GI Bill and DoD tuition assistance). 85 corresponds to the 85/15 proposals that have been floated in past Congresses.
assumptions:
  - key: mitigation_share
    label: Share of the gap closed without losing students
    unit: fraction
    low: 0.25
    base: 0.5
    high: 0.75
    source: estimate
    rationale: Schools near the cap raise non-federal revenue (employer-paid tuition, cash-pay and institutional-loan programs, price changes for non-aided students) before turning away aided students; the rest of the gap is closed by enrolling fewer federally aided students.
channels:
  - type: demand_volume
    label: Fewer federally aided students at the most dependent institutions
    params:
      d_volume: -(1 - assumption.mitigation_share) * max(0, 1 - (1 - exposure.ninety_ten_hi_ratio) / (1 - input.cap_pct / 100))
      exposed_revenue_share: exposure.ninety_ten_hi_revenue_share
  - type: demand_volume
    label: Fewer federally aided students at the other institutions
    params:
      d_volume: -(1 - assumption.mitigation_share) * max(0, 1 - (1 - exposure.ninety_ten_lo_ratio) / (1 - input.cap_pct / 100))
      exposed_revenue_share: exposure.ninety_ten_lo_revenue_share
exposure_keys: [ninety_ten_hi_ratio, ninety_ten_hi_revenue_share, ninety_ten_lo_ratio, ninety_ten_lo_revenue_share]
default_role: neutral
references:
  - https://www.sec.gov/Archives/edgar/data/1013934/000101393426000006/stra-20251231.htm
  - https://www.sec.gov/Archives/edgar/data/730464/000110465926092044/cvsa-20260630x10k.htm
  - https://www.everycrsreport.com/reports/R46773.html
narrative:
  extra: "To bring an institution with federal share r down to cap c while keeping its non-federal revenue, federal revenue must fall until total revenue is (1 − r)/(1 − c) of today's; only the part not offset by new non-federal revenue is modelled as lost enrollment."
