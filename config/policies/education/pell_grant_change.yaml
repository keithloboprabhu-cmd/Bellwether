id: pell_grant_change
industry: education
name: Pell Grant cut or increase
description: A change in the maximum Pell Grant changes how much need-based federal aid low-income undergraduates bring to college. Many make up a cut with loans, but some drop out or enrol part-time. Strategic Education (Strayer) and Grand Canyon have the most Pell-funded undergraduates; Duolingo, Coursera and Stride are untouched.
persistence: permanent
user_inputs:
  - key: pell_change_pct
    label: Change in Pell Grant funding per student
    unit: percent
    min: -40
    max: 30
    step: 1
    default: -10
    help: Percent change in the Pell award (and so in Pell dollars reaching these schools). The default is a moderate cut; positive values model an increase.
assumptions:
  - key: loan_substitution
    label: Share of a Pell cut that students replace with loans or cash
    unit: fraction
    low: 0.3
    base: 0.5
    high: 0.7
    source: estimate
    rationale: Pell students at these schools usually also qualify for subsidised and unsubsidised Direct Loans with room under the limits, so many can borrow to replace lost grant aid; lower-income students are more loan-averse, so not all of it is replaced.
channels:
  - type: demand_volume
    label: Change in Pell-funded enrollment
    params:
      d_volume: input.pell_change_pct / 100 * (1 - assumption.loan_substitution)
      exposed_revenue_share: exposure.pell_revenue_share
exposure_keys: [pell_revenue_share]
default_role: neutral
references:
  - https://www.sec.gov/Archives/edgar/data/1013934/000101393426000006/stra-20251231.htm
  - https://www.sec.gov/Archives/edgar/data/730464/000110465926092044/cvsa-20260630x10k.htm
narrative:
  extra: "Pell revenue shares are estimates; none of the companies discloses Pell dollars separately from total federal aid."
