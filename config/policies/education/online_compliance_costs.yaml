id: online_compliance_costs
industry: education
name: Online education compliance costs
description: New federal and state rules on distance education (attendance and return-of-aid tracking, state authorization, digital accessibility, subscription cancellation rules) add operating cost for every dollar of online revenue. Fully online Duolingo and Coursera, and largely online Stride and Strategic Education, carry the broadest exposure, though cost relative to their margins varies.
persistence: permanent
user_inputs:
  - key: cost_pct
    label: Added compliance cost as a share of online revenue
    unit: percent
    min: 0
    max: 3
    step: 0.1
    default: 0.5
    help: Ongoing cost of staff, systems and audits to meet the new rules, as a percent of online revenue. Grand Canyon's 2025 10-K notes that changes to return-of-Title IV processes may raise its operational and compliance responsibilities.
assumptions:
  - key: pass_through
    label: Share of added cost passed into prices
    unit: fraction
    low: 0
    base: 0.2
    high: 0.4
    source: estimate
    rationale: Every online provider faces the rule, but tuition at Title IV schools is constrained by loan limits and price-sensitive adult learners, and consumer apps compete with free alternatives, so little cost is passed on.
  - key: elasticity
    label: Demand elasticity on any price increase
    unit: number
    low: 0.3
    base: 0.6
    high: 1
    source: estimate
    rationale: An industry-wide price rise loses less volume than a single provider's because students have fewer cheaper online substitutes.
channels:
  - type: cost
    label: Higher compliance cost for online programs
    params:
      exposed_cost_share: 0
      shock_pct: 0
      dcost_musd: baseline.revenue * exposure.online_revenue_share * input.cost_pct / 100
      pass_through: assumption.pass_through
      elasticity: assumption.elasticity
exposure_keys: [online_revenue_share]
default_role: neutral
references:
  - https://www.sec.gov/Archives/edgar/data/1434588/000110465926017047/lope-20251231x10k.htm
