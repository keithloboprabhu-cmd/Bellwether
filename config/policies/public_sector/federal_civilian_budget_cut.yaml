id: federal_civilian_budget_cut
industry: public_sector
name: Federal civilian budget cut
description: A cut to non-defense discretionary appropriations shrinks civilian-agency contract spending; contractors with large civil portfolios (Leidos, Booz Allen, SAIC) lose the most, defense-heavy General Dynamics the least.
persistence: permanent
user_inputs:
  - key: d_budget_pct
    label: Change in civilian-agency discretionary budget
    unit: percent
    min: -30
    max: 10
    step: 1
    default: -5
    help: Negative is a cut. The FY2026 President's budget proposed deep non-defense discretionary cuts; enacted year-to-year changes are usually a few percent.
assumptions:
  - key: contract_beta
    label: Contract-spending change per 1% budget change
    unit: multiple
    low: 0.6
    base: 1.0
    high: 1.5
    source: estimate
    rationale: Agencies can protect payroll and grants and cut contracts first (beta > 1), or shield mission IT and cut elsewhere (beta < 1); 1.0 assumes contract spending moves with the topline.
channels:
  - type: gov_budget
    label: Lower civilian-agency contract spending
    params:
      gov_revenue_share: exposure.govcon_civilian_share
      d_budget_pct: input.d_budget_pct / 100
      program_relevance: assumption.contract_beta
exposure_keys: [govcon_civilian_share]
default_role: neutral
references:
  - https://www.sec.gov/Archives/edgar/data/1336920/000133692026000030/ldos-20260102.htm
  - https://www.sec.gov/Archives/edgar/data/1443646/000162828026037521/bah-20260331.htm
