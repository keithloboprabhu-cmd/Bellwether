id: airline_bag_fee_cap
industry: transportation_logistics
name: Cap or ban on checked-bag fees
description: A hypothetical federal restriction reduces reported airline baggage-fee revenue. American, Delta, United and Southwest use their own 2025 BTS observations. The input is a reduction in total baggage-fee revenue, not an exact mapping from a free-first-bag rule; fare recapture is an uncertain behavioral assumption.
persistence: permanent
user_inputs:
  - key: fee_cut_pct
    label: Cut in checked-bag fee revenue
    unit: percent
    min: 0
    max: 100
    step: 5
    default: 50
    help: Hypothetical percent reduction in reported baggage-fee revenue. A first-bag exemption cannot be translated into this percentage without a separately measured fee mix.
assumptions:
  - key: fare_recapture
    label: Share recaptured through higher base fares
    unit: fraction
    low: 0.3
    base: 0.5
    high: 0.7
    source: estimate
    rationale: Bag fees were introduced in 2008 partly in place of fare increases. Airlines would rebuild some of the revenue in fares, but competition from low-cost carriers limits how much.
channels:
  - type: price
    label: Lower checked-bag fee revenue
    params:
      d_price: -input.fee_cut_pct / 100
      exposed_revenue_share: exposure.tl_checked_bag_fee_revenue_share
      offset_share: assumption.fare_recapture
exposure_keys: [tl_checked_bag_fee_revenue_share]
default_role: neutral
references:
  - https://www.bts.gov/topics/airlines-and-airports/baggage-fees-airline-2025
  - https://www.sec.gov/Archives/edgar/data/27904/000002790426000013/dal-20251231.htm
narrative:
  extra: "Historical carrier fees are measured; future fares and profit responses are not. Southwest's broad bag fees began during 2025, so its observation is a partial-year base. Small reported earnings can produce large EPS changes even when fees are a small revenue share."
