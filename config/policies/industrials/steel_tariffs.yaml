id: steel_tariffs
industry: industrials
name: Higher tariffs on imported steel
description: A higher Section 232-style tariff on imported steel lets US mills raise prices, which helps Nucor and
  raises costs for steel buyers. Caterpillar and Deere are hit hardest because they use the most steel; GE Aerospace,
  Honeywell and 3M barely notice.
persistence: permanent
showcase: true
user_inputs:
- key: tariff_pct
  label: Change in the steel tariff
  unit: percentage points
  min: -50
  max: 50
  step: 5
  default: 25
  help: Added to the existing Section 232 steel tariff (negative cuts it). The 2018 tariff was 25%; Nucor's 2025
    10-K says it was fully reinstated in 2025 without exemptions and broadened to about 600 fabricated steel products.
assumptions:
- key: price_response
  label: Rise in US steel prices per 1 point of tariff
  unit: fraction
  low: 0.06480000000000001
  base: 0.0956
  high: 0.11199999999999999
  source: "USITC Publication 5405, corrected May 2023, table 5.2, printed p.125 (PDF p.125), 2018\u20132021 average-steel-price\
    \ effects"
  source_url: https://www.usitc.gov/publications/332/pub5405.pdf
  rationale: "Buyer price response = annual effect 1.62\u20132.80%, average 2.39%, divided by the 25% Section 232\
    \ tariff. Historical calibration is not a forecast of later tariff regimes."
- key: pass_through
  label: "Share of the steel-cost increase passed on to customers (\u03C6)"
  unit: fraction
  low: 0.3
  base: 0.5
  high: 0.8
  source: estimate
  rationale: Caterpillar's 2025 10-K reports unfavorable price realization in a year of rising tariff costs, which
    suggests limited short-run pass-through; equipment makers usually recover more over one or two pricing cycles.
  source_url: https://www.sec.gov/Archives/edgar/data/18230/000001823026000008/cat-20251231.htm
- key: elasticity
  label: Demand elasticity (volume loss per 1% price rise)
  unit: number
  low: 0.3
  base: 0.6
  high: 1.0
  source: estimate
  rationale: Capital equipment demand is driven mostly by construction, mining and farm cycles, so it responds less
    than one-for-one to small price increases.
- key: flow_through
  label: Share of a domestic mill's extra steel revenue that reaches profit
  unit: fraction
  low: 0.5
  base: 0.7
  high: 0.9
  source: estimate
  rationale: Scrap and pig-iron prices tend to rise with finished-steel prices, so mills keep only part of a price
    increase as wider metal margins.
- key: producer_price_response
  label: Domestic mill price response per tariff point
  unit: fraction
  low: 0.0208
  base: 0.0296
  high: 0.0348
  source: "USITC Publication 5405 table 5.2, printed p.125, domestic steel producer prices: 0.52\u20130.87%, average\
    \ 0.74%, under 25% tariffs"
  source_url: https://www.usitc.gov/publications/332/pub5405.pdf
  rationale: Domestic mill prices differ from the blended price buyers pay. Historical range does not include a
    separate volume or capacity effect.
derived:
  steel_price_rise: input.tariff_pct / 100 * assumption.price_response
  domestic_steel_price_rise: input.tariff_pct / 100 * assumption.producer_price_response
channels:
- type: cost
  label: Higher prices for steel and steel parts
  params:
    exposed_cost_share: exposure.ind_steel_share_of_cogs
    shock_pct: derived.steel_price_rise
    pass_through: assumption.pass_through
    elasticity: assumption.elasticity
  roles:
  - importer
- type: domestic_uplift
  label: Higher US steel prices behind the tariff wall
  params:
    domestic_sales_share: exposure.ind_domestic_steel_sales_share
    price_uplift: derived.domestic_steel_price_rise
    flow_through: assumption.flow_through
  roles:
  - domestic_producer
exposure_keys:
- ind_steel_share_of_cogs
- ind_domestic_steel_sales_share
roles:
  NUE: domestic_producer
  STLD: domestic_producer
  CLF: domestic_producer
default_role: importer
references:
- https://www.polsinelli.com/publications/usitc-releases-report-on-the-economic-impact-of-the-section-232-and-301-tariffs-on-u-s-industries
- https://reason.com/2023/03/16/u-s-trade-commission-admits-tariffs-raised-prices-for-american-consumers/
- https://www.usitc.gov/publications/332/pub5405.pdf
- https://www.sec.gov/Archives/edgar/data/73309/000119312526071575/nue-20251231.htm
- https://www.sec.gov/Archives/edgar/data/18230/000001823026000008/cat-20251231.htm
narrative:
  extra: "USITC table 5.2 separately calibrates average buyer prices and domestic producer prices. Historical 2018\u2013\
    2021 effects are not the total observed EPS change and are not a forecast of a later tariff regime. Pass-through,\
    \ flow-through and company cost shares still require independent calibration."
