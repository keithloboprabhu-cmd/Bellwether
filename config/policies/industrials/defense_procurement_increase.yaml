id: defense_procurement_increase
industry: industrials
name: Higher defense spending
description: A bigger defense budget buys more military engines, avionics and spares. Honeywell and GE Aerospace, each with about a tenth of revenue from the Department of Defense, gain; the others have little defense business.
persistence: permanent
user_inputs:
  - key: d_budget_pct
    label: Change in the defense budget
    unit: percent
    min: -20
    max: 20
    step: 1
    default: 5
    help: Positive is an increase in the defense topline.
assumptions:
  - key: hardware_capture
    label: Company revenue change per 1% budget change
    unit: multiple
    low: 0.5
    base: 0.9
    high: 1.2
    source: estimate
    rationale: Procurement and operations-and-maintenance money (engines, avionics, spares) tends to move at least in line with the topline, but some new money goes to shipbuilding and munitions that these companies don't supply.
channels:
  - type: gov_budget
    label: More military engine and avionics spending
    params:
      gov_revenue_share: exposure.govcon_defense_intel_share
      d_budget_pct: input.d_budget_pct / 100
      program_relevance: assumption.hardware_capture
exposure_keys: [govcon_defense_intel_share]
default_role: neutral
references:
  - https://www.sec.gov/Archives/edgar/data/773840/000077384026000013/hon-20251231.htm
  - https://www.sec.gov/Archives/edgar/data/40545/000004054526000008/ge-20251231.htm
narrative:
  extra: "Honeywell's 10-K says it does not expect proposed 2026 defense budget changes to significantly affect its results, given its mix of programs and commercial dual-use products."
