id: minimum_wage_increase
industry: consumer_retail
name: Federal minimum wage increase
description: A higher federal minimum wage lifts pay for hourly store and warehouse staff paid below it (and some just above); retailers pass part of the cost into prices and sell a little less.
persistence: permanent
user_inputs:
  - key: new_min
    label: New federal minimum wage
    unit: USD per hour
    min: 7.25
    max: 25
    step: 0.25
    default: 17
    help: The federal minimum has been $7.25 since 2009. CBO (2019) analysed $15 by 2025 and found it would raise pay for ~17 million workers. A floor below a company's starting wage has no effect here.
assumptions:
  - key: annual_hours
    label: Average annual hours per hourly employee
    unit: hours
    low: 1400
    base: 1600
    high: 1800
    source: "BLS CES via FRED: average weekly hours of production and nonsupervisory employees, retail trade, 30.7 (Sep 2026), ≈1,600 hours a year"
    source_url: https://fred.stlouisfed.org/series/CES4200000007
  - key: payroll_gap_factor
    label: Payroll increase as a share of (headcount × full wage gap)
    unit: fraction
    low: 0.15
    base: 0.3
    high: 0.5
    source: estimate
    rationale: "Only workers near the starting wage get the full gap; more-tenured staff get less. CBO (2019) found ~10 million workers just above $15 might also get raises (spillover) on top of ~17 million below it, so the high end allows broad compression raises."
    source_url: https://www.npr.org/2019/07/08/739607964/-15-minimum-wage-would-boost-17-million-workers-cut-1-3-million-jobs-cbo-says
  - key: pass_through
    label: Share of the wage cost passed to shoppers (φ)
    unit: fraction
    low: 0.3
    base: 0.6
    high: 0.9
    source: estimate
    rationale: The increase hits every competitor at once, so prices can rise, but low-price formats (Walmart, Costco) compete on price and absorb part of it.
  - key: elasticity
    label: Demand elasticity (volume loss per 1% price rise)
    unit: number
    low: 0.3
    base: 0.6
    high: 1.0
    source: estimate
    rationale: An industry-wide price rise loses less volume than a single store's, since shoppers have nowhere cheaper to go; below the unit elasticity used for firm-level shocks.
channels:
  - type: cost
    label: Higher pay for US hourly staff
    params:
      exposed_cost_share: 0
      shock_pct: 0
      dcost_musd: exposure.us_hourly_workers_m * assumption.annual_hours * max(0, input.new_min - exposure.us_starting_wage) * assumption.payroll_gap_factor
      pass_through: assumption.pass_through
      elasticity: assumption.elasticity
exposure_keys: [us_hourly_workers_m, us_starting_wage]
references:
  - https://www.npr.org/2019/07/08/739607964/-15-minimum-wage-would-boost-17-million-workers-cut-1-3-million-jobs-cbo-says
  - https://fred.stlouisfed.org/series/CES4200000007
narrative:
  extra: "Costco and Amazon already pay at or near $20, so a floor below that barely touches them; Walmart, Target and Home Depot start nearer $14–$15."
