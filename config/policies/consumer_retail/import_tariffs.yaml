id: import_tariffs
industry: consumer_retail
name: Import tariffs on consumer goods
description: An additional tariff on imported goods, on top of the duties already in the latest fiscal-year baseline, raises retailers' merchandise costs; they pass part of it to shoppers, who buy a little less.
persistence: permanent
showcase: true
user_inputs:
  - key: tariff_pct
    label: Additional tariff above current duties
    unit: percentage points
    min: -15
    max: 80
    step: 1
    default: 10
    help: Change in the ad valorem duty on the customs value of imported goods, measured from the duties already
      embedded in each retailer's latest fiscal-year costs (FY2025/26 baselines include most 2025 tariffs). Negative
      values model a rollback; about -15 points would roughly undo the 2025 rise in the average effective US tariff
      rate (estimate). The model does not net out the small (1 + current duty) denominator effect.
assumptions:
  - key: pass_through
    label: Share of the cost increase passed to shoppers (φ)
    unit: fraction
    low: 0.3
    base: 0.6
    high: 0.9
    source: estimate
    rationale: Amiti, Redding & Weinstein (2019) find near-complete pass-through of 2018 tariffs to import prices at the border, but Cavallo, Gopinath, Neiman & Tang (2021) find much smaller pass-through to retail shelf prices; range spans both.
    source_url: https://www.aeaweb.org/articles?id=10.1257/aeri.20190536
  - key: elasticity
    label: Demand elasticity (volume loss per 1% price rise)
    unit: number
    low: 0.5
    base: 1.0
    high: 1.5
    source: estimate
    rationale: Unit elasticity as a central case for broad retail baskets; essentials are less elastic, discretionary goods more.
channels:
  - type: cost
    label: Tariff on imported merchandise
    params:
      exposed_cost_share: exposure.us_import_share_of_cogs
      shock_pct: input.tariff_pct / 100
      pass_through: assumption.pass_through
      elasticity: assumption.elasticity
exposure_keys: [us_import_share_of_cogs]
default_role: importer
references:
  - https://www.aeaweb.org/doi/10.1257/jep.33.4.187
  - https://www.aeaweb.org/articles?id=10.1257/aeri.20190536
