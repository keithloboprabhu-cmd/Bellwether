id: aca_subsidy_change
industry: healthcare
name: ACA premium subsidy change
description: A change in ACA premium tax credits (e.g. expiry of the enhanced subsidies) changes how many people buy exchange plans. Centene and Molina also have material exchange businesses; Humana and (from 2026) CVS/Aetna have exited the exchanges. Company-specific premium shares are used.
persistence: permanent
user_inputs:
  - key: enrollment_change_pct
    label: Change in subsidized exchange enrollment
    unit: percent
    min: -50
    max: 30
    step: 1
    default: -20
    help: Percent change in ACA exchange enrollment caused by the subsidy change (negative = fewer enrollees, as when enhanced subsidies lapse).
assumptions:
  - key: retained_share
    label: Share of lost exchange revenue the insurer keeps in other products
    unit: fraction
    low: 0
    base: 0.1
    high: 0.25
    source: estimate
    rationale: Some people who drop exchange coverage move to employer, Medicaid or other plans of the same insurer; most become uninsured or switch carriers.
channels:
  - type: demand_volume
    label: Change in ACA exchange enrollment
    params:
      d_volume: input.enrollment_change_pct / 100 * (1 - assumption.retained_share)
      exposed_revenue_share: exposure.aca_exchange_revenue_share
exposure_keys: [aca_exchange_revenue_share]
default_role: neutral
references:
  - https://www.sec.gov/Archives/edgar/data/64803/000006480326000010/cvs-20251231.htm
narrative:
  extra: "Profit is lost at the contribution margin; the remaining exchange pool also tends to get sicker when healthier people drop out, which is not modelled separately."
